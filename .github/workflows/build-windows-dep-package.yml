name: Build Windows Dependency Package

on:
  workflow_dispatch:
    inputs:
      bundle_name:
        description: "Bundle name to build the dependency package for"
        required: true
        type: string
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - prod
        default: "dev"
      skip_upload:
        description: "Skip uploading to server (save as artifact only)"
        required: false
        default: false
        type: boolean

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Sync dependencies
        shell: pwsh
        run: uv sync --no-dev

      - name: Verify environment
        shell: pwsh
        env:
          AYON_SERVER_URL: ${{ vars.AYON_SERVER_URL }}
          AYON_API_KEY: ${{ secrets.AYON_API_KEY }}
        run: |
          Write-Host "Environment: ${{ inputs.environment }}"
          Write-Host "AYON_SERVER_URL: $env:AYON_SERVER_URL"
          if (-not $env:AYON_SERVER_URL) {
            Write-Host "AYON_SERVER_URL: NOT SET — add it as a variable in the '${{ inputs.environment }}' environment"
            exit 1
          }
          if ($env:AYON_API_KEY) {
            Write-Host "AYON_API_KEY: set ($($env:AYON_API_KEY.Substring(0,4))...)"
          } else {
            Write-Host "AYON_API_KEY: NOT SET — add it as a secret in the '${{ inputs.environment }}' environment"
            exit 1
          }

      - name: Create dependency package
        shell: pwsh
        env:
          AYON_SERVER_URL: ${{ vars.AYON_SERVER_URL }}
          AYON_API_KEY: ${{ secrets.AYON_API_KEY }}
        run: |
          $outputDir = "${{ github.workspace }}\output"
          New-Item -ItemType Directory -Force -Path $outputDir

          $createArgs = @(
            "${{ github.workspace }}\dependencies",
            "create",
            "-b", "${{ inputs.bundle_name }}",
            "--output-dir", $outputDir
          )

          if ("${{ inputs.skip_upload }}" -eq "true") {
            $createArgs += "--skip-upload"
          }

          & "${{ github.workspace }}\.venv\Scripts\python.exe" @createArgs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-dependency-package
          path: output/ayon_*_windows.zip
          retention-days: 30
